plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
    id 'com.google.firebase.crashlytics' version "3.0.2" apply false
    id 'com.diffplug.spotless' version '6.12.1'
    alias(libs.plugins.kotlin.android) apply false
}

tasks.register('applyPatch-sampleapp+notification+voip-java') {
    group = 'Custom Tasks'
    description = 'Applies the sampleapp+notification+voip-java patch'

    doLast {
        def projectDir = file('.')

        // Execute git reset --hard to discard any changes
        exec {
            workingDir = projectDir
            commandLine 'git', 'reset', '--hard'
        }

        def targetDir = file('sample-app-java')  // Directory to delete (same as above)
        if (targetDir.exists()) {
            println "Deleting existing folder: ${targetDir}"
            targetDir.deleteDir()  // Deletes the folder and all of its contents
        }

        def patchFile = file('patches/sampleapp+notification+voip-java.patch')
        if (!patchFile.exists()) {
            throw new GradleException("Patch file does not exist: ${patchFile}")
        }

        println "Applying patch: ${patchFile}"
        exec {
            workingDir = projectDir
            commandLine 'git', 'apply', patchFile.absolutePath
        }
    }
}

